name: Apply Security Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-security-hardening.cjs'
      - '.github/workflows/apply-security-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply security patch
        run: node scripts/apply-security-hardening.cjs

      - name: Commit security hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No security changes needed"
            exit 0
          fi
          git config user.name "HearCare Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server/src/index.js server/package.json
          git commit -m "Harden authentication and API response security"
          git push origin HEAD:main
